<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ladrix</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='5' fill='rgb(15,36,54)' stroke='rgb(232,117,44)' stroke-width='2'/%3E%3Crect x='8' y='8' width='16' height='16' fill='none' stroke='rgb(232,117,44)' stroke-opacity='0.4' stroke-width='1.4'/%3E%3Ctext x='16' y='22' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='15' fill='rgb(232,117,44)' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   LADRIX — DESIGN TOKENS
   Blueprint navy + safety orange + concrete gray.
   Inspired by construction drawings, site signage and
   measurement instruments. Deliberately unrounded, quiet,
   high legibility, minimal motion.
   ========================================================= */
:root{
  --ink-900:#0F2436;
  --ink-800:#152F45;
  --ink-700:#1C3A52;
  --ink-600:#274A66;
  --steel-500:#5A7184;
  --steel-400:#7C8FA0;
  --steel-300:#A7B4BF;
  --concrete-200:#E3E7EA;
  --concrete-100:#ECEEF0;
  --concrete-50:#F6F7F8;
  --paper:#FFFFFF;
  --line-200:#DCE1E5;
  --line-300:#C7CED3;

  --safety-600:#C8611E;
  --safety-500:#E8752C;
  --safety-100:#FCE7D4;

  --validate-700:#215F44;
  --validate-600:#2E7D5B;
  --validate-100:#DDEEE4;

  --alert-700:#8F2A2A;
  --alert-600:#C23B3B;
  --alert-100:#F7DEDE;

  --confidence-700:#1D4C7A;
  --confidence-600:#2563A6;
  --confidence-100:#DCE8F3;

  --amber-600:#B8860B;
  --amber-100:#F5EBD0;

  --font-display:'Barlow Condensed', sans-serif;
  --font-body:'Public Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;

  --radius-sm:3px;
  --radius-md:5px;
  --radius-lg:8px;

  --shadow-card:0 1px 2px rgba(15,36,54,0.07), 0 1px 0 rgba(232,117,44,0.05);
  --shadow-pop:0 8px 24px rgba(15,36,54,0.16), 0 2px 6px rgba(15,36,54,0.08);

  --sidebar-w:248px;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background-color:var(--concrete-100);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.06  0 0 0 0 0.14  0 0 0 0 0.21  0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  color:var(--ink-900);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  margin:0;
  letter-spacing:0.005em;
  color:var(--ink-900);
}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--safety-100);}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible{
  outline:2px solid var(--confidence-600);
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

.mono{font-family:var(--font-mono);}

/* Icon sprites: sane default size, overridden per-context below with
   higher-specificity ".context .icn svg" rules so source order never matters. */
.icn{display:inline-flex; align-items:center; justify-content:center; flex:none; vertical-align:-2px;}
.icn svg{width:14px; height:14px; display:block;}

/* ---------- APP SHELL ---------- */
#app{display:flex; min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  flex:0 0 var(--sidebar-w);
  background:var(--ink-900);
  color:#EAF0F4;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.sidebar-brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:22px 20px 18px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.brand-mark{
  width:34px;height:34px;
  border:1.5px solid var(--safety-500);
  border-radius:3px 5px 4px 6px;
  transform:rotate(-1.5deg);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);
  font-weight:700;
  font-size:15px;
  color:var(--safety-500);
  flex:none;
  position:relative;
}
.brand-mark::after{
  content:"";
  position:absolute; inset:5px;
  border:1px solid rgba(232,117,44,0.35);
  border-radius:2px 4px 2px 3px;
}
.brand-text{display:flex; flex-direction:column; line-height:1.2;}
.brand-text .name{font-family:var(--font-display); font-weight:700; font-size:15.5px; letter-spacing:0.02em;}
.brand-text .sub{font-size:10.5px; color:var(--steel-300); font-family:var(--font-mono); letter-spacing:0.03em; margin-top:2px;}

.sidebar-project{
  padding:14px 20px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.sidebar-project .label{font-size:10.5px; letter-spacing:0.01em; color:var(--steel-300); font-family:var(--font-body);}
.sidebar-project .value{font-size:13px; margin-top:4px; color:#EAF0F4; font-weight:500;}

.sidebar-nav{flex:1; padding:10px 10px; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px;
  border-radius:var(--radius-sm);
  color:#C7D3DB;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  border:none;
  background:transparent;
  width:100%;
  text-align:left;
  margin-bottom:2px;
  transition:background 0.12s ease, color 0.12s ease;
}
.nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
.nav-item.active{background:var(--safety-500); color:#1A0D02; font-weight:600;}
.nav-item .icn svg{width:16px; height:16px; stroke:#C7D3DB;}
.nav-item.active .icn svg{stroke:#1A0D02;}
.nav-item:hover .icn svg{stroke:#fff;}
.nav-num{font-family:var(--font-mono); font-size:10px; color:var(--steel-400); width:14px; flex:none;}

.sidebar-foot{
  padding:14px 20px 18px;
  border-top:1px solid rgba(255,255,255,0.08);
  font-size:11px;
  color:var(--steel-400);
  font-family:var(--font-mono);
  line-height:1.6;
}
.sidebar-foot b{color:var(--steel-300);}

.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}

.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  padding:14px 28px;
  background:rgba(246,247,248,0.92);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line-200);
}
.topbar-crumbs{font-family:var(--font-body); font-size:12px; font-weight:600; color:var(--steel-500);}
.topbar-crumbs .sep{margin:0 6px; color:var(--line-300);}
.topbar-title{font-family:var(--font-display); font-weight:700; font-size:19px; margin-top:2px;}
.topbar-right{display:flex; align-items:center; gap:10px;}

.user-chip{
  display:flex; align-items:center; gap:8px;
  padding:6px 10px 6px 6px;
  background:var(--paper);
  border:1px solid var(--line-200);
  border-radius:20px;
}
.user-avatar{
  width:24px;height:24px;border-radius:50%;
  background:var(--confidence-600); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:700; font-family:var(--font-display);
}
.user-chip .who{font-size:12px; font-weight:600;}
.user-chip .role{font-size:10px; color:var(--steel-500);}

main.view{padding:24px 28px 56px; max-width:1280px;}

/* ---------- PRIMITIVES ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--font-body); font-weight:600; font-size:13px;
  padding:10px 18px;
  border-radius:var(--radius-sm);
  border:1px solid transparent;
  cursor:pointer;
  transition:filter 0.12s ease, background 0.12s ease, border-color .12s ease;
  white-space:nowrap;
}
.btn:active{filter:brightness(0.94);}
.btn-primary{background:var(--safety-500); color:#1A0D02;}
.btn-primary:hover{background:var(--safety-600); color:#fff;}
.btn-primary:disabled{background:var(--concrete-200); color:var(--steel-400); cursor:not-allowed;}
.btn-dark{background:var(--ink-900); color:#fff;}
.btn-dark:hover{background:var(--ink-700);}
.btn-outline{background:transparent; border-color:var(--line-300); color:var(--ink-800);}
.btn-outline:hover{border-color:var(--ink-700); background:var(--concrete-50);}
.btn-ghost{background:transparent; color:var(--steel-500); padding:10px 12px;}
.btn-ghost:hover{color:var(--ink-900); background:var(--concrete-100);}
.btn-danger{background:transparent; border-color:var(--alert-600); color:var(--alert-700);}
.btn-danger:hover{background:var(--alert-100);}
.btn-validate{background:var(--validate-600); color:#fff;}
.btn-validate:hover{background:var(--validate-700);}
.btn-sm{padding:6px 12px; font-size:12px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:0.55; cursor:not-allowed;}

.card{
  background:var(--paper);
  border:1px solid var(--line-200);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
}
.card-pad{padding:20px;}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;}
.card-title{font-family:var(--font-display); font-weight:700; font-size:14.5px;}
.card-title-row{display:flex; align-items:center; gap:8px;}
.card-eyebrow{font-family:var(--font-body); font-weight:600; font-size:11.5px; letter-spacing:0.005em; color:var(--steel-500); margin-bottom:4px; display:block;}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-12{grid-template-columns:repeat(12,1fr);}
@media (max-width:1080px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
}

.kpi-card{padding:16px 18px;}
.kpi-eyebrow{font-family:var(--font-body); font-weight:600; font-size:11.5px; letter-spacing:0.005em; color:var(--steel-500);}
.kpi-value{font-family:var(--font-display); font-weight:700; font-size:30px; margin-top:6px; display:flex; align-items:baseline; gap:5px;}
.kpi-value .unit{font-size:14px; color:var(--steel-500); font-weight:500; font-family:var(--font-mono);}
.kpi-foot{margin-top:8px; font-size:11.5px; color:var(--steel-500); display:flex; align-items:center; gap:6px;}
.kpi-foot.up{color:var(--validate-700);}
.kpi-foot.warn{color:var(--safety-600);}

.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--font-mono); font-size:10.5px; font-weight:600;
  padding:3px 8px;
  border-radius:20px;
  letter-spacing:0.02em;
  text-transform:uppercase;
  white-space:nowrap;
}
.badge-dot{width:6px; height:6px; border-radius:50%; flex:none;}
.badge-pendiente{background:var(--amber-100); color:var(--amber-600);}
.badge-pendiente .badge-dot{background:var(--amber-600);}
.badge-validado{background:var(--validate-100); color:var(--validate-700);}
.badge-validado .badge-dot{background:var(--validate-600);}
.badge-ajustado{background:var(--confidence-100); color:var(--confidence-700);}
.badge-ajustado .badge-dot{background:var(--confidence-600);}
.badge-rechazado{background:var(--alert-100); color:var(--alert-700);}
.badge-rechazado .badge-dot{background:var(--alert-600);}
.badge-neutral{background:var(--concrete-200); color:var(--steel-500);}
.badge-neutral .badge-dot{background:var(--steel-400);}

.table-wrap{overflow-x:auto; border:1px solid var(--line-200); border-radius:var(--radius-md);}
table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px;}
thead th{
  text-align:left; font-family:var(--font-mono); font-weight:600; font-size:10.5px;
  text-transform:uppercase; letter-spacing:0.05em; color:var(--steel-500);
  background:var(--concrete-50); padding:10px 14px; border-bottom:1px solid var(--line-200);
  white-space:nowrap;
}
tbody td{padding:11px 14px; border-bottom:1px solid var(--line-200); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--concrete-50);}
td.num, th.num{text-align:right; font-family:var(--font-mono);}
.row-link{cursor:pointer;}
.cell-code{font-family:var(--font-mono); font-weight:600;}
.cell-muted{color:var(--steel-500);}

.progress-track{
  height:7px; width:100%; background:var(--concrete-200); border-radius:20px; overflow:hidden; position:relative;
}
.progress-fill{height:100%; border-radius:20px; background:var(--safety-500); transition:width .5s cubic-bezier(.4,0,.2,1);}
.progress-fill.validate{background:var(--validate-600);}
.progress-fill.confidence{background:var(--confidence-600);}
.progress-mark-prev{
  position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink-900); opacity:0.5;
}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-800); font-family:var(--font-body);}
.field .hint{font-size:11px; color:var(--steel-500); font-weight:400; text-transform:none; font-family:var(--font-body);}
select,input[type=text],input[type=number],input[type=date],textarea{
  font-family:var(--font-body); font-size:13.5px; color:var(--ink-900);
  padding:10px 12px; border:1px solid var(--line-300); border-radius:var(--radius-sm);
  background:var(--paper); width:100%;
}
select:disabled,input:disabled{background:var(--concrete-100); color:var(--steel-400); cursor:not-allowed;}
textarea{resize:vertical; min-height:64px; font-family:var(--font-body);}

.readonly-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.readonly-item .rl-label{font-family:var(--font-body); font-size:11px; color:var(--steel-500);}
.readonly-item .rl-value{font-family:var(--font-display); font-weight:700; font-size:17px; margin-top:3px;}
.readonly-item .rl-value.small{font-size:14px; font-family:var(--font-mono); font-weight:600;}

.stepper{display:flex; align-items:center; gap:0; margin-bottom:26px;}
.step-item{display:flex; align-items:center; gap:9px;}
.step-dot{
  width:26px;height:26px;border-radius:50%;
  border:1.5px solid var(--line-300); color:var(--steel-500);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:11px; font-weight:600;
  background:var(--paper); flex:none;
}
.step-item.done .step-dot{background:var(--validate-600); border-color:var(--validate-600); color:#fff;}
.step-item.current .step-dot{background:var(--safety-500); border-color:var(--safety-500); color:#1A0D02;}
.step-label{font-size:12px; font-weight:600; color:var(--steel-500);}
.step-item.current .step-label{color:var(--ink-900);}
.step-item.done .step-label{color:var(--ink-800);}
.step-rule{width:38px; height:1px; background:var(--line-300); margin:0 8px;}

.upload-zone{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1.5px dashed var(--line-300); border-radius:var(--radius-lg);
  background:var(--concrete-50);
  padding:44px 24px; text-align:center; cursor:pointer;
  transition:border-color .12s ease, background .12s ease;
}
.upload-zone:hover, .upload-zone.drag{border-color:var(--safety-500); background:var(--safety-100);}
.upload-zone .icn{margin-bottom:14px;}
.upload-zone .icn svg{width:40px; height:40px; stroke:var(--steel-500);}
.upload-title{font-weight:600; font-size:14px;}
.upload-sub{font-size:12px; color:var(--steel-500); margin-top:4px;}

.evidence-preview{position:relative; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--line-200); background:var(--ink-900);}
.evidence-preview img{display:block; width:100%; height:340px; object-fit:cover;}

.scenario-options{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.scenario-card{
  border:1.5px solid var(--line-200); border-radius:var(--radius-md); padding:12px 14px; cursor:pointer;
  background:var(--paper);
}
.scenario-card:hover{border-color:var(--steel-400);}
.scenario-card.selected{border-color:var(--safety-500); background:var(--safety-100);}
.scenario-card .sc-title{font-weight:600; font-size:12.5px; display:flex; align-items:center; gap:7px;}
.scenario-card .sc-desc{font-size:11px; color:var(--steel-500); margin-top:4px; line-height:1.45;}

/* --- analysis console (signature element) --- */
.console-wrap{
  background:var(--ink-900); border-radius:var(--radius-lg); padding:36px 30px;
  color:#EAF0F4; text-align:center; position:relative; overflow:hidden;
}
.console-wrap::before{
  content:""; position:absolute; inset:0;
  background-image:linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:26px 26px; pointer-events:none;
}
.console-frame{
  width:180px; height:180px; margin:0 auto 26px; position:relative;
}
.console-frame svg{width:100%; height:100%;}
.console-steps{max-width:360px; margin:0 auto; text-align:left; position:relative;}
.console-step{display:flex; align-items:center; gap:10px; padding:7px 0; font-family:var(--font-mono); font-size:12.5px; color:var(--steel-300); opacity:0.45; transition:opacity .2s ease, color .2s ease;}
.console-step.active{opacity:1; color:#fff;}
.console-step.complete{opacity:0.85; color:var(--validate-100);}
.console-step .cs-icon{width:15px; flex:none; text-align:center;}
.console-label{font-family:var(--font-body); font-weight:600; font-size:12px; letter-spacing:0.005em; color:var(--safety-500); margin-bottom:16px;}

.result-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:20px; align-items:start;}
@media (max-width:980px){.result-grid{grid-template-columns:1fr;}}
.photo-frame{position:relative; border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--line-200); background:var(--ink-900);}
.photo-frame img{display:block; width:100%; height:420px; object-fit:cover; opacity:0.96;}
.mask-overlay{position:absolute; left:0; right:0; bottom:0; pointer-events:none;}
.corner{position:absolute; width:22px; height:22px; border-color:var(--safety-500); opacity:.9;}
.corner.tl{top:12px; left:12px; border-top:2px solid; border-left:2px solid; transform:rotate(-2deg);}
.corner.tr{top:12px; right:12px; border-top:2px solid; border-right:2px solid; transform:rotate(1.5deg);}
.corner.bl{bottom:12px; left:12px; border-bottom:2px solid; border-left:2px solid; transform:rotate(1deg);}
.corner.br{bottom:12px; right:12px; border-bottom:2px solid; border-right:2px solid; transform:rotate(-1.5deg);}
.photo-tag{position:absolute; top:14px; left:14px; background:rgba(15,36,54,0.78); color:#fff; font-family:var(--font-mono); font-size:10.5px; padding:5px 9px; border-radius:3px; letter-spacing:0.03em;}
.photo-tag.right{left:auto; right:14px; background:rgba(232,117,44,0.92); color:#1A0D02; font-weight:700;}

.readout{font-family:var(--font-mono);}
.readout-row{display:flex; align-items:baseline; justify-content:space-between; padding:11px 0; border-bottom:1px dashed var(--line-200);}
.readout-row:last-child{border-bottom:none;}
.readout-label{font-size:12px; color:var(--steel-500); font-family:var(--font-body);}
.readout-value{font-family:var(--font-display); font-weight:700; font-size:19px;}
.readout-value.big{font-size:26px;}
.readout-value .unit{font-family:var(--font-mono); font-size:12px; color:var(--steel-500); font-weight:500; margin-left:3px;}
.readout-sub{font-size:10.5px; color:var(--steel-500); margin-top:2px; font-family:var(--font-body);}

.alert-banner{
  display:flex; gap:12px; align-items:flex-start;
  padding:13px 16px; border-radius:var(--radius-md); margin-bottom:16px;
  border:1px solid var(--alert-600); background:var(--alert-100); color:var(--alert-700);
}
.alert-banner.warn{border-color:var(--amber-600); background:var(--amber-100); color:#6b4d09;}

/* Genera una imagen "fotografía" ilustrativa de un muro en construcción,
   como SVG propio (no una foto real) — usada como evidencia de demostración
   cuando el usuario no tiene una fotografía a mano, y como miniaturas de
   historial. pct = porcentaje de mampostería visible desde la base. */
function demoWallImage(pct, seedTone){
  pct = clamp(pct,0,100);
  const w=640,h=420;
  const fillH = Math.round(h*(pct/100));
  const tone = seedTone||0;
  const brickRows = [];
  const rowH = 22;
  let y = h;
  let rowIdx=0;
  while(y > h-fillH-rowH){
    const offset = (rowIdx%2===0)? 0 : -28;
    let x = offset;
    while(x < w+56){
      brickRows.push('<rect x="'+x+'" y="'+(y-rowH)+'" width="54" height="'+(rowH-3)+'" rx="1.5" fill="rgb('+(176+((rowIdx*7+tone)%18))+','+(120+((rowIdx*5+tone)%16))+','+(92+((rowIdx*3+tone)%14))+')" stroke="rgba(60,35,20,0.35)" stroke-width="1"/>');
      x += 56;
    }
    y -= rowH;
    rowIdx++;
  }
  const exposedTop = h - fillH;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'">'
    +'<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="#B8C4CC"/><stop offset="1" stop-color="#DDE3E7"/></linearGradient>'
    +'<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C9BA6"/><stop offset="1" stop-color="#5E6E78"/></linearGradient></defs>'
    +'<rect width="'+w+'" height="'+h+'" fill="url(#sky)"/>'
    +'<rect x="0" y="'+(h-26)+'" width="'+w+'" height="26" fill="url(#fl)"/>'
    +'<g>'+brickRows.join('')+'</g>'
    +(pct<100? '<rect x="0" y="'+Math.max(0,exposedTop-96)+'" width="'+w+'" height="96" fill="#AEB9C0" opacity="0.5"/>'+
      '<g stroke="#8A97A0" stroke-width="2">'+
      Array.from({length:6}).map(function(_,i){var x=60+i*100; return '<line x1="'+x+'" y1="'+Math.max(0,exposedTop-96)+'" x2="'+x+'" y2="'+exposedTop+'"/>';}).join('')
      +'</g>' : '')
    +'</svg>'
  );
}

function classify(pActual, pAnterior, requiereRevision, confianza){
  if(pActual < pAnterior) return 'rojo';
  const diff = pActual - pAnterior;
  if(diff < 5 || requiereRevision || confianza < 70) return 'amarillo';
  return 'verde';
}

  'Superficie mayormente terminada, con acabado uniforme en todo el encuadre.',
  'Se ve avance adicional frente al último registro, concentrado en la mitad de abajo.',
];
const LIMITACIONES_DEMO_POOL = [
  'La luz de lado deja sombras sobre parte del muro.',
  'El ángulo de la foto no alcanza a cubrir toda la esquina superior.',
  'Un andamio tapa parte de la base del muro.',
  'El encuadre no alcanza a mostrar todo el elemento.',
];

function buildDemoData(){
  MUROS = [];
  REGISTROS = [];
  let regCounter = 0;

  MUROS_BASE.forEach(function(m, mi){
    const areaTotal = Math.round(m.largo*m.alto*10)/10;
    const muro = {
      codigo:m.codigo, proyecto:PROYECTO.nombre, zona:m.zona, piso:m.piso, unidad:m.unidad,
      ubicacion:m.zona+' – '+m.piso+' – '+m.unidad, notas:'',
      actividad:'Mampostería', contratistaId:m.contratista,
      largo:m.largo, alto:m.alto, areaTotal:areaTotal,
      avanceValidado: m.avance, areaValidada: Math.round(areaTotal*(m.avance/100)*10)/10,
      historial: [],
    };

    const stages = stageSequence(m.avance);
    const recentOffset = 3 + ((mi*7) % 35); /* días desde hoy del último hito de este muro: 3–37 */
    let prev = 0;
    stages.forEach(function(stage, si){
      const daysBack = recentOffset + (stages.length-1-si) * 17; /* hitos anteriores, más atrás en el tiempo */
      const fecha = daysAgo(daysBack);
      const areaEstim = Math.round(areaTotal*(stage/100)*10)/10;
      const areaPrev = Math.round(areaTotal*(prev/100)*10)/10;
      const nuevaCantidad = Math.round((areaEstim-areaPrev)*10)/10;
      const ajustado = (si % 3 === 2);
      const cantidadValidada = ajustado ? Math.max(0, Math.round((nuevaCantidad-0.3)*10)/10) : nuevaCantidad;
      const confianza = 86 + ((mi*5+si*7) % 11);
      const limitaciones = (si % 4 === 1) ? [LIMITACIONES_DEMO_POOL[(mi+si) % LIMITACIONES_DEMO_POOL.length]] : [];
      const requiereRevision = ajustado || limitaciones.length>0;
      regCounter++;
      const reg = {
        id: 'REG-' + (2000+regCounter),
        fecha: fecha,
        muroCodigo: muro.codigo,
        contratistaId: muro.contratistaId,
        avanceAnterior: prev,
        avanceDetectado: stage,
        confianza: confianza,
        areaTotal: areaTotal,
        areaEstimadaAcum: areaEstim,
        nuevaCantidadEstimada: nuevaCantidad,
        cantidadValidada: cantidadValidada,
        estado: ajustado ? 'Ajustado' : 'Validado',
        responsable: RESPONSABLES[(mi+si)%RESPONSABLES.length],
        observaciones: ajustado ? 'Se ajustó cantidad tras verificación visual en sitio.' : '',
        descripcion: DESCRIPCIONES_DEMO[(mi+si) % DESCRIPCIONES_DEMO.length],
        limitaciones: limitaciones,
        requiereRevision: requiereRevision,
        clasificacion: classify(stage, prev, requiereRevision, confianza),
        imagen: demoWallImage(stage, mi*17+si*3),
        tiempoValidacionMin: 3 + ((mi*3+si*5) % 11),
        origen:'seed',
      };
      muro.historial.push(reg);
      REGISTROS.push(reg);
      prev = stage;
    });

    MUROS.push(muro);
  });

  /* Recalcular avance validado real acumulado (suma de cantidadValidada) para
     que quede consistente con la cadena de ajustes histórica. */
  MUROS.forEach(function(muro){
    let acumulado = 0;
    muro.historial.forEach(function(r){ acumulado += r.cantidadValidada; });
    muro.areaValidada = Math.round(clamp(acumulado,0,muro.areaTotal)*10)/10;
    muro.avanceValidado = muro.areaTotal>0 ? Math.round((muro.areaValidada/muro.areaTotal)*1000)/10 : 0;
  });

  /* Registros PENDIENTES sembrados: análisis ya ejecutado, a la espera de
     validación humana. No modifican todavía el avance validado del muro. */
  const pendientesSeed = [
    { muro:'M-002', detectado:88, confianza:90, dias:2, minutos:null },
    { muro:'M-006', detectado:45, confianza:85, dias:1, minutos:null },
    { muro:'M-010', detectado:55, confianza:88, dias:4, minutos:null },
  ];
  pendientesSeed.forEach(function(p, i){
    const muro = MUROS.find(function(m){ return m.codigo===p.muro; });
    if(!muro) return;
    const areaEstim = Math.round(muro.areaTotal*(p.detectado/100)*10)/10;
    const nuevaCantidad = Math.max(0, Math.round((areaEstim-muro.areaValidada)*10)/10);
    const limitaciones = (i===1) ? [LIMITACIONES_DEMO_POOL[i % LIMITACIONES_DEMO_POOL.length]] : [];
    regCounter++;
    const reg = {
      id:'REG-'+(2000+regCounter),
      fecha: daysAgo(p.dias),
      muroCodigo: muro.codigo,
      contratistaId: muro.contratistaId,
      avanceAnterior: muro.avanceValidado,
      avanceDetectado: p.detectado,
      confianza: p.confianza,
      areaTotal: muro.areaTotal,
      areaEstimadaAcum: areaEstim,
      nuevaCantidadEstimada: nuevaCantidad,
      cantidadValidada: null,
      estado:'Pendiente',
      responsable: RESPONSABLES[i%RESPONSABLES.length],
      observaciones:'',
      descripcion: DESCRIPCIONES_DEMO[(i+2) % DESCRIPCIONES_DEMO.length],
      limitaciones: limitaciones,
      requiereRevision: limitaciones.length>0,
      clasificacion: classify(p.detectado, muro.avanceValidado, limitaciones.length>0, p.confianza),
      imagen: demoWallImage(p.detectado, i*11+4),
      tiempoValidacionMin: null,
      origen:'seed',
    };
    muro.historial.push(reg);
    REGISTROS.push(reg);
  });

  REGISTROS.sort(function(a,b){ return b.fecha-a.fecha; });
}

/* ---- gráficos SVG minimalistas (sin librerías) ---- */
function svgBarChart(opts){
  const labels=opts.labels, values=opts.values, colors=opts.colors||[], unit=opts.unit||'';
  const W=560,H=220, padL=6, padR=6, padB=30, padT=18;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const max = Math.max(1, ...values) * 1.15;
  const bw = chartW/values.length;
  let bars='', labs='';
  values.forEach(function(v,i){
    const bh = chartH*(v/max);
    const x = padL + i*bw + bw*0.2;
    const bwi = bw*0.6;
    const y = padT + (chartH-bh);
    const color = colors[i] || 'var(--confidence-600)';
    bars += '<rect x="'+x+'" y="'+y+'" width="'+bwi+'" height="'+bh+'" rx="2.5" fill="'+color+'"><title>'+labels[i]+': '+v+unit+'</title></rect>';
    bars += '<text x="'+(x+bwi/2)+'" y="'+(y-6)+'" text-anchor="middle" class="chart-val">'+ (Math.round(v*10)/10) +'</text>';
    labs += '<text x="'+(x+bwi/2)+'" y="'+(H-10)+'" text-anchor="middle" class="chart-lab">'+escapeHtml(labels[i])+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart-svg" preserveAspectRatio="xMidYMid meet">'+
    '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="var(--line-300)" stroke-width="1"/>'+
    bars+labs+
    '<style>.chart-val{font-family:var(--font-mono);font-size:11px;fill:var(--ink-800);font-weight:600;}.chart-lab{font-family:var(--font-mono);font-size:10px;fill:var(--steel-500);}</style>'+
    '</svg>';
}

function svgLineChart(opts){
  const labels=opts.labels, values=opts.values, unit=opts.unit||'';
  const W=560,H=220, padL=8, padR=8, padB=30, padT=18;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const max = Math.max(1, ...values) * 1.2;
  const min = 0;
  const stepX = values.length>1 ? chartW/(values.length-1) : 0;
  function xAt(i){ return padL + i*stepX; }
  function yAt(v){ return padT + chartH*(1-((v-min)/(max-min||1))); }
  let path='', dots='', labs='', grid='';
  for(let g=0; g<=3; g++){
    const gy = padT + chartH*(g/3);
    grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--line-200)" stroke-width="1"/>';
  }
  values.forEach(function(v,i){
    const x=xAt(i), y=yAt(v);
    path += (i===0?'M':'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    dots += '<circle cx="'+x+'" cy="'+y+'" r="3.4" fill="var(--safety-500)" stroke="#fff" stroke-width="1.4"><title>'+labels[i]+': '+v+unit+'</title></circle>';
    labs += '<text x="'+x+'" y="'+(H-10)+'" text-anchor="middle" class="chart-lab">'+escapeHtml(labels[i])+'</text>';
  });
  const areaPath = path + 'L '+xAt(values.length-1).toFixed(1)+' '+(H-padB)+' L '+xAt(0).toFixed(1)+' '+(H-padB)+' Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart-svg" preserveAspectRatio="xMidYMid meet">'+
    grid+
    '<path d="'+areaPath+'" fill="var(--safety-100)" opacity="0.7"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--safety-500)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+labs+
    '<style>.chart-lab{font-family:var(--font-mono);font-size:10px;fill:var(--steel-500);}</style>'+
    '</svg>';
}

async function doLogin(){
  const input = document.getElementById('loginPassword');
  const pw = input ? input.value : '';
  if(!pw){ STATE.auth.error = 'Ingresa una contraseña.'; render(); return; }
  STATE.auth.checking = true; STATE.auth.error = null; render();
  try{
    const resp = await fetch('/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw }),
    });
    const data = await resp.json().catch(function(){ return {}; });
    if(resp.ok && data.ok){
      sessionStorage.setItem('ladrix_pw', pw);
      STATE.auth = { loggedIn:true, password:pw, checking:false, error:null };
      render();
    } else {
      STATE.auth = { loggedIn:false, password:'', checking:false, error:'Contraseña incorrecta.' };
      render();
    }
  }catch(e){
    STATE.auth = { loggedIn:false, password:'', checking:false, error:'No se pudo verificar la contraseña. Intenta de nuevo.' };
    render();
  }
}

function logout(){
  sessionStorage.removeItem('ladrix_pw');
  STATE.auth = { loggedIn:false, password:'', checking:false, error:null };
  render();
}

/* ---------------------------------------------------------
   CÁLCULOS AGREGADOS (reutilizados en Dashboard y Reportes)
   --------------------------------------------------------- */
function totalAreaPlanificada(){ return MUROS.reduce(function(s,m){return s+m.areaTotal;},0); }
function totalAreaValidada(){ return MUROS.reduce(function(s,m){return s+m.areaValidada;},0); }
function avanceGlobalPct(){ const t=totalAreaPlanificada(); return t>0 ? (totalAreaValidada()/t*100) : 0; }
function contratistasActivos(){ return CONTRATISTAS.filter(function(c){ return MUROS.some(function(m){return m.contratistaId===c.id;}); }); }

function avancePorZona(){
  const zonas = Array.from(new Set(MUROS.map(function(m){return m.zona;})));
  return zonas.map(function(z){
    const muros = MUROS.filter(function(m){return m.zona===z;});
    const total = muros.reduce(function(s,m){return s+m.areaTotal;},0);
    const val = muros.reduce(function(s,m){return s+m.areaValidada;},0);
    return {zona:z, pct: total>0? (val/total*100):0, total:total, val:val};
  });
}

function validadoPorContratista(){
  return CONTRATISTAS.map(function(c){
    const muros = MUROS.filter(function(m){return m.contratistaId===c.id;});
    const val = muros.reduce(function(s,m){return s+m.areaValidada;},0);
    const total = muros.reduce(function(s,m){return s+m.areaTotal;},0);
    return {contratista:c, val:val, total:total, pendientes: REGISTROS.filter(function(r){return r.contratistaId===c.id && r.estado==='Pendiente';}).length};
  });
}

function evolucionAcumuladaMensual(){
  const resueltos = REGISTROS.filter(function(r){ return r.estado==='Validado'||r.estado==='Ajustado'; }).slice().sort(function(a,b){return a.fecha-b.fecha;});
  const buckets = {};
  const order = [];
  resueltos.forEach(function(r){
    const key = r.fecha.getFullYear()+'-'+String(r.fecha.getMonth()+1).padStart(2,'0');
    if(!(key in buckets)){ buckets[key]=0; order.push(key); }
    buckets[key]+= r.cantidadValidada;
  });
  let acc=0;
  const labels=[], values=[];
  order.forEach(function(key){
    acc += buckets[key];
    const parts = key.split('-');
    labels.push(MESES[parseInt(parts[1],10)-1]+' '+parts[0].slice(2));
    values.push(Math.round(acc*10)/10);
  });
  if(labels.length===0){ labels.push('—'); values.push(0); }
  return {labels:labels, values:values};
}

function diferenciaIAvsValidacion(){
  const resueltos = REGISTROS.filter(function(r){ return r.estado==='Validado'||r.estado==='Ajustado'; });
  if(resueltos.length===0) return {promedio:0, promedioPct:0, n:0};
  let sum=0, sumPct=0;
  resueltos.forEach(function(r){
    const diff = Math.abs(r.nuevaCantidadEstimada - r.cantidadValidada);
    sum += diff;
    sumPct += r.nuevaCantidadEstimada>0 ? (diff/Math.abs(r.nuevaCantidadEstimada)*100) : 0;
  });
  return {promedio: sum/resueltos.length, promedioPct: sumPct/resueltos.length, n:resueltos.length};
}

function tiempoPromedioValidacion(){
  const withTime = REGISTROS.filter(function(r){ return r.tiempoValidacionMin!==null && r.tiempoValidacionMin!==undefined; });
  if(withTime.length===0) return 0;
  return withTime.reduce(function(s,r){return s+r.tiempoValidacionMin;},0)/withTime.length;
}

function distribucionEstados(){
  const resueltos = REGISTROS.filter(function(r){ return r.estado!=='Pendiente'; });
  const n = resueltos.length || 1;
  const validado = resueltos.filter(function(r){return r.estado==='Validado';}).length;
  const ajustado = resueltos.filter(function(r){return r.estado==='Ajustado';}).length;
  const rechazado = resueltos.filter(function(r){return r.estado==='Rechazado';}).length;
  return {
    validadoPct: validado/n*100, ajustadoPct: ajustado/n*100, rechazadoPct: rechazado/n*100,
    validado:validado, ajustado:ajustado, rechazado:rechazado, total:resueltos.length,
  };
}

/* ---------------------------------------------------------
   UTILIDAD DETERMINISTA (usada para variar tonos de ladrillo en las
   imágenes de referencia y el patrón de la máscara ilustrativa —
   ya NO se usa para inventar porcentajes de avance: esos ahora
   vienen siempre del servicio real de IA)
   --------------------------------------------------------- */
function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}

/* Color de acento por contratista (como si cada uno tuviera su propia
   carpeta de color en la oficina de obra), derivado de su id. */
const ACCENT_PALETTE = ['var(--safety-500)','var(--confidence-600)','var(--validate-600)','var(--amber-600)','var(--alert-600)'];
function accentFor(id){ return ACCENT_PALETTE[hashStr(String(id)) % ACCENT_PALETTE.length]; }

function recomputeMuroAggregates(muro){
  let acumulado = 0;
  muro.historial.forEach(function(r){
    if(r.estado==='Validado' || r.estado==='Ajustado') acumulado += (r.cantidadValidada||0);
  });
  muro.areaValidada = Math.round(clamp(acumulado,0,muro.areaTotal)*10)/10;
  muro.avanceValidado = muro.areaTotal>0 ? Math.round((muro.areaValidada/muro.areaTotal)*1000)/10 : 0;
}

function renderStepper(currentKey){
  const idx = FLOW_STEPS.findIndex(function(s){return s.key===currentKey;});
  return '<div class="stepper">'+FLOW_STEPS.map(function(s,i){
    const cls = i<idx ? 'done' : (i===idx ? 'current' : '');
    return '<div class="step-item '+cls+'">'+
      '<div class="step-dot">'+(i<idx? icon('check') : (i+1))+'</div>'+
      '<div class="step-label">'+s.label+'</div>'+
      '</div>' + (i<FLOW_STEPS.length-1? '<div class="step-rule"></div>' : '');

}

function toggleOtro(selectEl, wrapId){
  const wrap = document.getElementById(wrapId);
  if(wrap) wrap.style.display = (selectEl.value==='__otro__') ? 'block' : 'none';
}

function updateNuevoElementoArea(){
  const l = parseFloat(document.getElementById('neLargo').value)||0;
  const a = parseFloat(document.getElementById('neAlto').value)||0;
  const out = document.getElementById('neAreaCalc');
  if(out) out.value = (l>0 && a>0) ? fmtArea(Math.round(l*a*10)/10)+' m²' : '—';
}

function guardarNuevoElemento(){
  function val(id){ const el=document.getElementById(id); return el ? el.value : ''; }

  const proyectoSel = val('neProyecto');
  const proyecto = proyectoSel==='__otro__' ? val('neProyectoNuevo').trim() : proyectoSel;
  const zonaSel = val('neZona');
  const zona = zonaSel==='__otro__' ? val('neZonaNueva').trim() : zonaSel;
  const pisoSel = val('nePiso');
  const piso = pisoSel==='__otro__' ? val('nePisoNueva').trim() : pisoSel;
  const codigo = val('neCodigo').trim().toUpperCase();
  const notas = val('neNotas').trim();
  const largo = parseFloat(val('neLargo'));
  const alto = parseFloat(val('neAlto'));
  const contratistaSel = val('neContratista');
  let contratistaId = contratistaSel==='__otro__' ? '' : contratistaSel;
  const contratistaNuevoNombre = contratistaSel==='__otro__' ? val('neContratistaNuevo').trim() : '';

  if(!proyecto){ showToast('error','Indica el proyecto.'); return; }
  if(!zona){ showToast('error','Indica la zona o torre.'); return; }
  if(!piso){ showToast('error','Indica el piso.'); return; }
  if(!codigo){ showToast('error','Indica el código del elemento.'); return; }
  if(getMuro(codigo)){ showToast('error','Ya existe un elemento con el código "'+codigo+'". Usa un código distinto.'); return; }
  if(contratistaSel==='__otro__' && !contratistaNuevoNombre){ showToast('error','Indica el nombre del nuevo contratista.'); return; }
  if(!largo || largo<=0){ showToast('error','Indica un largo válido, mayor a 0.'); return; }
  if(!alto || alto<=0){ showToast('error','Indica un alto válido, mayor a 0.'); return; }

  if(proyecto && PROYECTOS.indexOf(proyecto)===-1) PROYECTOS.push(proyecto);

  if(contratistaSel==='__otro__'){
    contratistaId = uid('CT');
    CONTRATISTAS.push({ id:contratistaId, nombre:contratistaNuevoNombre, actividad:'Mampostería', contacto:'Contratista registrado manualmente desde la app.' });
  }

  const areaTotal = Math.round(largo*alto*10)/10;
  const muro = {
    codigo:codigo, proyecto:proyecto, zona:zona, piso:piso, unidad:notas || codigo,
    ubicacion:zona+' – '+piso+(notas? ' – '+notas : ''), notas:notas,
    actividad:'Mampostería', contratistaId:contratistaId,
    largo:largo, alto:alto, areaTotal:areaTotal,
    avanceValidado:0, areaValidada:0, historial:[],
  };
  MUROS.push(muro);

  STATE.flow.modo = 'existente';
  STATE.flow.zona = zona; STATE.flow.piso = piso; STATE.flow.muroCodigo = codigo;
  STATE.flow.step = 'evidencia';
  showToast('success','Elemento '+codigo+' registrado. Ya está disponible en el catálogo.');
}

/* Reduce cualquier imagen (foto real o SVG de referencia) a un JPEG
   base64 de tamaño razonable antes de enviarla a la API. */
function prepareImageForApi(dataUrl){
  return new Promise(function(resolve, reject){
    const img = new Image();
    img.onload = function(){
      try{
        const maxDim = 1024;
        const w = img.naturalWidth || 800, h = img.naturalHeight || 600;
        const scale = Math.min(1, maxDim/Math.max(w,h));
        const cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        const canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        const outUrl = canvas.toDataURL('image/jpeg', 0.85);
        const comma = outUrl.indexOf(',');
        resolve({ media_type:'image/jpeg', data: outUrl.slice(comma+1) });
      }catch(err){ reject(err); }
    };
    img.onerror = function(){ reject(new Error('No se pudo leer la fotografía cargada.')); };
    img.src = dataUrl;
  });
}

function parseAiJson(raw){
  if(!raw) return null;
  let cleaned = raw.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  try{ return JSON.parse(cleaned); }catch(e){}
  const match = cleaned.match(/\{[\s\S]*\}/);
  if(match){ try{ return JSON.parse(match[0]); }catch(e){} }
  return null;
}

function normalizeAiResult(obj){
  const pct = clamp(parseFloat(obj.avance_estimado_porcentaje), 0, 100);
  const conf = clamp(parseFloat(obj.nivel_confianza), 0, 100);
  let limitaciones = obj.limitaciones;
  if(!Array.isArray(limitaciones)) limitaciones = [];
  limitaciones = limitaciones.filter(function(l){return typeof l==='string' && l.trim();}).slice(0,6);
  return {
    avance_estimado_porcentaje: isNaN(pct)?0:Math.round(pct*10)/10,
    nivel_confianza: isNaN(conf)?50:Math.round(conf),
    descripcion: (typeof obj.descripcion==='string' && obj.descripcion.trim()) ? obj.descripcion.trim() : 'La IA no incluyó una descripción para este resultado.',
    limitaciones: limitaciones,
    requiere_revision: !!obj.requiere_revision,
  };
}

/* Ruta de tu función serverless propia (Cloudflare Pages Functions), que
   reenvía la petición a https://api.anthropic.com/v1/messages agregando la
   API key de forma segura desde el servidor. Al vivir en el mismo dominio
   que este HTML, no hay que configurar nada de CORS. */
const AI_PROXY_URL = '/analyze';

async function callVisionAPI(muro, apiImage){
  const prompt = buildAnalysisPrompt(muro);
  let response;
  try{
    response = await fetch(AI_PROXY_URL, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'X-App-Password': STATE.auth.password || '',
      },
      body: JSON.stringify({
        model:'claude-sonnet-5',
        max_tokens:700,
        messages:[{
          role:'user',
          content:[
            { type:'image', source:{ type:'base64', media_type: apiImage.media_type, data: apiImage.data } },
            { type:'text', text: prompt },
          ],
        }],
      }),
    });
  }catch(networkErr){
    throw new Error('No se pudo contactar el servicio de IA. Verifica que AI_PROXY_URL esté configurada correctamente y que el proxy esté desplegado.');
  }
  if(!response.ok){
    let detail = '';
    try{
      const errBody = await response.json();
      detail = (errBody && errBody.error && (errBody.error.message || errBody.error)) || '';
      if(typeof detail!=='string') detail = JSON.stringify(detail);
    }catch(e){ /* respuesta no era JSON, se ignora */ }
    throw new Error('El servicio de IA respondió con un error (código '+response.status+ (detail? ': '+detail : '')+').');
  }
  const data = await response.json();
  const textBlocks = (data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;});
  const raw = textBlocks.join('\n');
  const parsed = parseAiJson(raw);
  if(!parsed || typeof parsed.avance_estimado_porcentaje!=='number' && isNaN(parseFloat(parsed.avance_estimado_porcentaje))){
    throw new Error('La IA no devolvió un resultado interpretable. Intenta nuevamente.');
  }
  return normalizeAiResult(parsed);
}

function handleAnalysisError(msg){
  STATE.flow.analysisRunning = false;
  STATE.flow.analysisError = msg;
  STATE.flow.step = 'evidencia';
  render();
}

async function runRealAnalysis(){
  if(STATE.flow.analysisRunning) return;
  STATE.flow.analysisRunning = true;
  STATE.flow.analysisError = null;
  const muro = getMuro(STATE.flow.muroCodigo);

  setStageState(0,'active');
  await wait(280);
  setStageState(0,'complete');

  setStageState(1,'active');
  let apiImage;
  try{
    apiImage = await prepareImageForApi(STATE.flow.imagen);
  }catch(e){
    handleAnalysisError('No se pudo procesar la imagen cargada. Intenta con otra fotografía.');
    return;
  }
  await wait(200);
  setStageState(1,'complete');

  setStageState(2,'active');
  let aiResult;
  try{
    aiResult = await callVisionAPI(muro, apiImage);
  }catch(e){
    handleAnalysisError(e && e.message ? e.message : 'No se pudo contactar el servicio de IA.');
    return;
  }
  setStageState(2,'complete');

  setStageState(3,'active');
  await wait(260);
  setStageState(3,'complete');

  setStageState(4,'active');
  await wait(220);
  setStageState(4,'complete');

  const pActual = aiResult.avance_estimado_porcentaje;
  const pAnterior = muro.avanceValidado;
  const areaEstimAcum = Math.round(muro.areaTotal*(pActual/100)*10)/10;
  const inconsistente = pActual < pAnterior;
  const nuevaCantidad = inconsistente ? 0 : Math.max(0, Math.round((areaEstimAcum-muro.areaValidada)*10)/10);
  const clasificacion = classify(pActual, pAnterior, aiResult.requiere_revision, aiResult.nivel_confianza);

  STATE.flow.analysisRunning = false;
  STATE.flow.analysisDoneAt = Date.now();
  STATE.flow.step = 'resultado';
  STATE.flow.resultado = {
    avanceAnterior: pAnterior,
    avanceDetectado: pActual,
    confianza: aiResult.nivel_confianza,
    areaTotal: muro.areaTotal,
    areaValidadaPrev: muro.areaValidada,
    areaEstimadaAcum: areaEstimAcum,
    nuevaCantidadEstimada: nuevaCantidad,
    inconsistente: inconsistente,
    descripcion: aiResult.descripcion,
    limitaciones: aiResult.limitaciones,
    requiereRevision: aiResult.requiere_revision,
    clasificacion: clasificacion,
  };
  render();
}

function maskOverlayMarkup(pct, seed){
  pct = clamp(pct,0,100);
  const h = hashStr('mask'+seed);
  const pts = [];
  const segs = 7;
  for(let i=0;i<=segs;i++){
    const x = (i/segs*100).toFixed(1);
    const jag = ((h>>(i%8)) % 10);
    pts.push(x+'% '+jag+'%');
  }
  const clip = 'polygon(0% 100%, '+pts.join(', ')+', 100% 100%)';
  return '<div class="mask-overlay" style="height:'+pct+'%;">'+
    '<div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(37,99,166,0.05), rgba(37,99,166,0.34) 30%, rgba(37,99,166,0.4));clip-path:'+clip+';border-top:2px dashed rgba(255,255,255,0.85);"></div>'+
  '</div>';
}

    '<div class="grid grid-2">'+
      '<div class="field"><label>Cantidad reconocida (m²)</label>'+
        '<input type="number" id="cantidadInput" min="0" max="'+remaining+'" step="0.1" value="'+cantidadEstClamped.toFixed(1)+'" oninput="onCantidadInput(this)">'+
        '<span class="hint" id="avancePreview">'+avancePreviewText(cantidadEstClamped)+'</span>'+
      '</div>'+
      '<div class="field"><label>Observaciones (opcional)</label><textarea id="obsInput" placeholder="Ej: se identificó una abertura no considerada por el sistema."></textarea></div>'+
    '</div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;">'+
      '<button class="btn btn-validate" data-action="flow-validate" data-mode="validar" '+(inconsistente?'disabled title="No disponible: el avance detectado es inferior al validado."':'')+'>'+icon('check')+' Validar cantidad estimada</button>'+
      '<button class="btn btn-primary" data-action="flow-validate" data-mode="ajustar">Guardar cantidad ajustada</button>'+
      '<button class="btn btn-outline" data-action="flow-validate" data-mode="pendiente">Guardar y revisar más tarde</button>'+
      '<button class="btn btn-ghost" style="color:var(--alert-700);margin-left:auto;" data-action="flow-toggle-reject">Rechazar análisis</button>'+
    '</div>';
}

function renderRejectPanel(){
  return '<div class="field"><label>Motivo del rechazo</label><textarea id="motivoInput" placeholder="Explica por qué se rechaza este análisis (ej: evidencia fotográfica no corresponde al muro, mala iluminación, ángulo insuficiente)."></textarea></div>'+
    '<div style="display:flex;gap:10px;">'+
      '<button class="btn btn-danger" data-action="flow-validate" data-mode="rechazar">Confirmar rechazo</button>'+
      '<button class="btn btn-ghost" data-action="flow-toggle-reject">Cancelar</button>'+
    '</div>';
}

function avancePreviewText(cantidad){
  const d = getFlowResultData();
  const nuevoAcum = clamp(d.areaValidadaPrev + (parseFloat(cantidad)||0), 0, d.areaTotal);
  const nuevoPct = d.areaTotal>0 ? (nuevoAcum/d.areaTotal*100) : 0;
  return 'Nuevo avance validado: '+fmtPct(nuevoPct)+' % (antes '+fmtPct(d.avanceAnterior)+' %) · '+fmtArea(nuevoAcum)+' m² de '+fmtArea(d.areaTotal)+' m²';
}

function onCantidadInput(el){
  const remaining = parseFloat(el.max);
  let v = parseFloat(el.value);
  if(isNaN(v)) v=0;
  v = clamp(v,0,remaining);
  const prevEl = document.getElementById('avancePreview');
  if(prevEl) prevEl.textContent = avancePreviewText(v);
}

/* ---------------------------------------------------------
   ENVÍO DE VALIDACIÓN (crea o resuelve el registro)
   --------------------------------------------------------- */
function showToastAndNav(type,msg,view,opts){
  navigate(view,opts);
  STATE.toast = {type:type,msg:msg};
  const app = document.getElementById('app');
  const existing = app.querySelector('.toast');
  if(existing) existing.remove();
  app.insertAdjacentHTML('beforeend', renderToast());
  setTimeout(function(){ STATE.toast=null; const t=document.querySelector('.toast'); if(t) t.remove(); },3600);
}

function submitValidation(mode){
  const reviewing = !!STATE.flow.reviewingRegistroId;
  const d = getFlowResultData();
  const muro = d.muro;
  const cantidadEstClamped = Math.max(0, Math.round(d.nuevaCantidadEstimada*10)/10);
  const remaining = Math.round((d.areaTotal-d.areaValidadaPrev)*10)/10;

  if(mode==='rechazar'){
    const motivoEl = document.getElementById('motivoInput');
    const motivo = motivoEl? motivoEl.value.trim() : '';
    if(!motivo){ showToast('error','Indica un motivo para rechazar el análisis.'); return; }
    if(reviewing){
      const reg = d.reg;
      reg.estado='Rechazado'; reg.cantidadValidada=0; reg.observaciones=motivo; reg.responsable='Camila Rojas';
    } else {
      const reg = {
        id:uid('REG'), fecha:new Date(), muroCodigo:muro.codigo, contratistaId:muro.contratistaId,
        avanceAnterior:d.avanceAnterior, avanceDetectado:d.avanceDetectado, confianza:d.confianza,
        areaTotal:d.areaTotal, areaEstimadaAcum:d.areaEstimadaAcum, nuevaCantidadEstimada:d.nuevaCantidadEstimada,
        cantidadValidada:0, estado:'Rechazado', responsable:'Camila Rojas', observaciones:motivo,
        descripcion:d.descripcion, limitaciones:d.limitaciones, requiereRevision:d.requiereRevision, clasificacion:d.clasificacion,
        imagen:d.imagen, tiempoValidacionMin:null, origen:'live',
      };
      muro.historial.unshift(reg); REGISTROS.unshift(reg);
    }
    showToastAndNav('error','Análisis rechazado. Se solicitará nueva evidencia fotográfica.','historial');
    return;
  }

  let cantidadFinal, estadoFinal;
  if(mode==='validar'){
    cantidadFinal = cantidadEstClamped;
    estadoFinal = 'Validado';
  } else if(mode==='ajustar'){
    const inputEl = document.getElementById('cantidadInput');
    cantidadFinal = clamp(parseFloat(inputEl && inputEl.value!==''? inputEl.value : '0'), 0, remaining);
    cantidadFinal = Math.round(cantidadFinal*10)/10;
    estadoFinal = Math.abs(cantidadFinal-cantidadEstClamped)<0.05 ? 'Validado' : 'Ajustado';
  } else {
    cantidadFinal = null; estadoFinal = 'Pendiente';
  }
  const obsEl = document.getElementById('obsInput');
  const obs = obsEl? obsEl.value.trim() : '';

  if(reviewing){
    const reg = d.reg;
    reg.estado=estadoFinal; reg.cantidadValidada=cantidadFinal; reg.observaciones=obs; reg.responsable='Camila Rojas';
    reg.tiempoValidacionMin = 2 + (hashStr(reg.id)%9);
    if(estadoFinal==='Validado'||estadoFinal==='Ajustado') recomputeMuroAggregates(muro);
  } else {
    const reg = {
      id:uid('REG'), fecha:new Date(), muroCodigo:muro.codigo, contratistaId:muro.contratistaId,
      avanceAnterior:d.avanceAnterior, avanceDetectado:d.avanceDetectado, confianza:d.confianza,
      areaTotal:d.areaTotal, areaEstimadaAcum:d.areaEstimadaAcum, nuevaCantidadEstimada:d.nuevaCantidadEstimada,
      cantidadValidada:cantidadFinal, estado:estadoFinal, responsable:'Camila Rojas', observaciones:obs,
      descripcion:d.descripcion, limitaciones:d.limitaciones, requiereRevision:d.requiereRevision, clasificacion:d.clasificacion,
      imagen:d.imagen, tiempoValidacionMin: STATE.flow.analysisDoneAt ? Math.max(0.5, Math.round((Date.now()-STATE.flow.analysisDoneAt)/6000)/10) : null,
      origen:'live',
    };
    muro.historial.unshift(reg); REGISTROS.unshift(reg);
    if(estadoFinal==='Validado'||estadoFinal==='Ajustado') recomputeMuroAggregates(muro);
  }

  if(mode==='pendiente'){
    showToastAndNav('success','Registro guardado como pendiente de validación.','pendientes');
  } else {
    showToastAndNav('success','Cantidad registrada. Avance de '+muro.codigo+' actualizado a '+fmtPct(muro.avanceValidado)+' %.','muro-detalle',{detalleMuroCodigo:muro.codigo});
  }
}

/* ---------------------------------------------------------
   PANTALLA: HISTORIAL DE AVANCES
   --------------------------------------------------------- */
function renderHistorial(){
  const f = STATE.historial;
  const zonas = Array.from(new Set(MUROS.map(function(m){return m.zona;})));
  let regs = REGISTROS.filter(function(r){return r.estado!=='Pendiente';});
  if(f.zona) regs = regs.filter(function(r){ const m=getMuro(r.muroCodigo); return m&&m.zona===f.zona; });
  if(f.contratista) regs = regs.filter(function(r){return r.contratistaId===f.contratista;});
  if(f.muro) regs = regs.filter(function(r){return r.muroCodigo===f.muro;});
  if(f.estado) regs = regs.filter(function(r){return r.estado===f.estado;});
  if(f.desde){ const dd=new Date(f.desde); regs = regs.filter(function(r){return r.fecha>=dd;}); }
  if(f.hasta){ const dh=new Date(f.hasta); dh.setHours(23,59,59); regs = regs.filter(function(r){return r.fecha<=dh;}); }
  regs = regs.slice().sort(function(a,b){return b.fecha-a.fecha;});

  const filtros = '<div class="filters-row">'+
    '<div class="field"><label>Zona</label><select data-action="hist-filter" data-field="zona"><option value="">Todas</option>'+
      zonas.map(function(z){return '<option value="'+z+'" '+(f.zona===z?'selected':'')+'>'+z+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Contratista</label><select data-action="hist-filter" data-field="contratista"><option value="">Todos</option>'+
      CONTRATISTAS.map(function(c){return '<option value="'+c.id+'" '+(f.contratista===c.id?'selected':'')+'>'+c.nombre+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Muro</label><select data-action="hist-filter" data-field="muro"><option value="">Todos</option>'+
      MUROS.map(function(m){return '<option value="'+m.codigo+'" '+(f.muro===m.codigo?'selected':'')+'>'+m.codigo+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Estado</label><select data-action="hist-filter" data-field="estado"><option value="">Todos</option>'+
      ['Validado','Ajustado','Rechazado'].map(function(e){return '<option value="'+e+'" '+(f.estado===e?'selected':'')+'>'+e+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Desde</label><input type="date" data-action="hist-filter" data-field="desde" value="'+f.desde+'"></div>'+
    '<div class="field"><label>Hasta</label><input type="date" data-action="hist-filter" data-field="hasta" value="'+f.hasta+'"></div>'+
    '<button class="btn btn-ghost btn-sm" data-action="hist-clear">Limpiar filtros</button>'+
    '</div>';

  const tabla = regs.length===0 ? emptyState('Sin resultados','Ajusta los filtros para ver registros del historial.','historial') :
    '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Muro</th><th>Contratista</th><th class="num">Avance anterior</th><th class="num">Avance detectado</th><th class="num">Cant. estimada</th><th class="num">Cant. validada</th><th>Estado</th><th></th></tr></thead><tbody>'+
    regs.map(function(r){
      return '<tr class="row-link" data-action="open-muro" data-codigo="'+r.muroCodigo+'">'+
        '<td class="mono cell-muted">'+fmtFecha(r.fecha)+'</td>'+
        '<td class="cell-code">'+r.muroCodigo+'</td>'+
        '<td>'+contratistaNombre(r.contratistaId)+'</td>'+
        '<td class="num mono cell-muted">'+fmtPct(r.avanceAnterior)+' %</td>'+
        '<td class="num mono">'+fmtPct(r.avanceDetectado)+' %</td>'+
        '<td class="num mono">'+fmtArea(r.nuevaCantidadEstimada)+' m²</td>'+
        '<td class="num mono">'+(r.cantidadValidada!==null? fmtArea(r.cantidadValidada)+' m²':'—')+'</td>'+
        '<td>'+badge(r.estado)+'</td>'+
        '<td class="cell-muted">'+icon('chevron')+'</td>'+
        '</tr>';
    }).join('')+
    '</tbody></table></div>';

  return '<div style="display:flex;flex-direction:column;gap:16px;">'+
    '<div class="card card-pad">'+filtros+tabla+'</div>'+
    (f.muro ? renderEvolucionMuro(getMuro(f.muro)) : '')+
  '</div>';
}

function renderEvolucionMuro(muro){
  if(!muro) return '';
  const stages = muro.historial.filter(function(r){return r.estado!=='Pendiente';}).slice().sort(function(a,b){return a.fecha-b.fecha;});
  const hitos = [0].concat(stages.map(function(r){return r.avanceDetectado;}));
  return '<div class="card card-pad">'+
    '<div class="card-head"><span class="card-title">Línea de evolución — '+muro.codigo+'</span>'+
    '<button class="btn btn-ghost btn-sm" data-action="open-muro" data-codigo="'+muro.codigo+'">Ver ficha completa '+icon('chevron')+'</button></div>'+
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'+
      hitos.map(function(h,i){
        return (i>0?'<span style="color:var(--line-300)">'+icon('chevron')+'</span>':'')+
          '<span class="tag-chip" style="'+(i===hitos.length-1?'background:var(--validate-100);color:var(--validate-700);border-color:var(--validate-100);':'')+'">'+fmtPct(h)+' %</span>';
      }).join('')+
    '</div>'+
    '</div>';
}
