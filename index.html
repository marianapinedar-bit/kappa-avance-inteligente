      '<div style="margin-top:16px;display:flex;align-items:center;gap:14px;">'+
        '<div style="flex:1;">'+progressBar(muro.avanceValidado,{cls:'validate'})+'</div>'+
        '<div class="mono" style="font-weight:700;">'+fmtPct(muro.avanceValidado)+' %</div>'+
      '</div>'+
      '<div style="font-size:11.5px;color:var(--steel-500);margin-top:6px;">Avance validado: '+fmtPct(muro.avanceValidado)+' % · Avance pendiente: '+fmtPct(pendientePct)+' % ('+fmtArea(pendienteArea)+' m²) · Largo '+muro.largo+' m × Alto '+muro.alto+' m</div>'+
    '</div>'+

    '<div class="card card-pad">'+
      '<div class="card-head"><span class="card-title">Trazabilidad — línea de tiempo</span></div>'+
      (eventos.length===0 ? emptyState('Sin registros todavía','Este elemento aún no tiene evidencia fotográfica ni análisis.','wall') :
      '<div class="timeline">'+
        eventos.map(function(r){
          const dotCls = r.estado==='Pendiente' ? 'pend' : (r.estado==='Rechazado' ? 'rej' : '');
          return '<div class="tl-item">'+
            '<div class="tl-dot '+dotCls+'"></div>'+
            '<div class="tl-head">'+
              '<span class="tl-date">'+fmtFecha(r.fecha)+'</span>'+badge(r.estado)+
              '<span class="mono" style="font-size:12px;color:var(--ink-800);">'+fmtPct(r.avanceAnterior)+'% → '+fmtPct(r.avanceDetectado)+'%</span>'+
            '</div>'+
            '<div style="display:flex;gap:12px;margin-top:8px;align-items:flex-start;">'+
              '<img src="'+r.imagen+'" style="width:78px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--line-200);flex:none;">'+
              '<div style="font-size:12px;color:var(--steel-500);">'+
                'Confianza IA: <b class="mono" style="color:var(--ink-800)">'+fmtPct(r.confianza)+'%</b> · '+
                'Cantidad estimada: <b class="mono" style="color:var(--ink-800)">'+fmtArea(r.nuevaCantidadEstimada)+' m²</b>'+
                (r.cantidadValidada!==null? ' · Cantidad validada: <b class="mono" style="color:var(--ink-800)">'+fmtArea(r.cantidadValidada)+' m²</b>' : '')+
                (r.responsable? ' · Responsable: '+r.responsable : '')+
                (r.observaciones? '<div style="margin-top:3px;font-style:italic;">"'+escapeHtml(r.observaciones)+'"</div>' : '')+
              '</div>'+
            '</div>'+
          '</div>';
        }).join('')+
      '</div>')+
    '</div>'+
  '</div>';
}

/* ---------------------------------------------------------
   PANTALLA: ELEMENTOS CONSTRUCTIVOS (catálogo)
   --------------------------------------------------------- */
function renderElementos(){
  const f = STATE.elementos;
  const zonas = Array.from(new Set(MUROS.map(function(m){return m.zona;})));
  let list = MUROS.slice();
  if(f.zona) list = list.filter(function(m){return m.zona===f.zona;});
  if(f.contratista) list = list.filter(function(m){return m.contratistaId===f.contratista;});
  if(f.estado) list = list.filter(function(m){return estadoMuro(m)===f.estado || (f.estado==='Validado'&&m.avanceValidado>=100);});
  list.sort(function(a,b){ return a.codigo.localeCompare(b.codigo); });

  const filtros = '<div class="filters-row">'+
    '<div class="field"><label>Zona</label><select data-action="elem-filter" data-field="zona"><option value="">Todas</option>'+
      zonas.map(function(z){return '<option value="'+z+'" '+(f.zona===z?'selected':'')+'>'+z+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Contratista</label><select data-action="elem-filter" data-field="contratista"><option value="">Todos</option>'+
      CONTRATISTAS.map(function(c){return '<option value="'+c.id+'" '+(f.contratista===c.id?'selected':'')+'>'+c.nombre+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Estado</label><select data-action="elem-filter" data-field="estado"><option value="">Todos</option>'+
      ['Sin iniciar','En proceso','Validado'].map(function(e){return '<option value="'+e+'" '+(f.estado===e?'selected':'')+'>'+e+'</option>';}).join('')+'</select></div>'+
    '<button class="btn btn-ghost btn-sm" data-action="elem-clear">Limpiar filtros</button>'+
    '</div>';

  const tabla = '<div class="table-wrap"><table><thead><tr><th>Código</th><th>Ubicación</th><th>Contratista</th><th class="num">Área total</th><th class="num">Avance</th><th>Estado</th><th></th></tr></thead><tbody>'+
    list.map(function(m){
      return '<tr>'+
        '<td class="cell-code row-link" data-action="open-muro" data-codigo="'+m.codigo+'">'+m.codigo+'</td>'+
        '<td class="cell-muted">'+m.ubicacion+'</td>'+
        '<td>'+contratistaNombre(m.contratistaId)+'</td>'+
        '<td class="num mono">'+fmtArea(m.areaTotal)+' m²</td>'+
        '<td class="num mono">'+fmtPct(m.avanceValidado)+' %</td>'+
        '<td>'+badge(estadoMuro(m))+'</td>'+
        '<td style="display:flex;gap:6px;justify-content:flex-end;">'+
          '<button class="btn btn-ghost btn-sm" data-action="open-muro" data-codigo="'+m.codigo+'">Ver ficha</button>'+
          (m.avanceValidado<100? '<button class="btn btn-outline btn-sm" data-action="start-registro" data-codigo="'+m.codigo+'">Registrar avance</button>' : '')+
        '</td>'+
        '</tr>';
    }).join('')+
    '</tbody></table></div>';

  return '<div class="card card-pad">'+
    '<div class="card-head"><span class="card-title">'+list.length+' elemento'+(list.length===1?'':'s')+' registrado'+(list.length===1?'':'s')+'</span></div>'+
    filtros+tabla+
    '</div>';
}

/* ---------------------------------------------------------
   PANTALLA: CONTRATISTAS
   --------------------------------------------------------- */
function renderContratistas(){
  if(STATE.contratistaDetalleId) return renderContratistaDetalle(STATE.contratistaDetalleId);
  const datos = validadoPorContratista();
  const tabla = '<div class="table-wrap"><table><thead><tr><th>Contratista</th><th>Actividad</th><th class="num">Área asignada</th><th class="num">Área validada</th><th class="num">Avance</th><th class="num">Pendientes</th></tr></thead><tbody>'+
    datos.map(function(d){
      const pct = d.total>0? (d.val/d.total*100):0;
      return '<tr class="row-link" data-action="open-contratista" data-id="'+d.contratista.id+'">'+
        '<td style="font-weight:600;">'+d.contratista.nombre+'</td>'+
        '<td class="cell-muted">'+d.contratista.actividad+'</td>'+
        '<td class="num mono">'+fmtArea(d.total)+' m²</td>'+
        '<td class="num mono">'+fmtArea(d.val)+' m²</td>'+
        '<td class="num mono">'+fmtPct(pct)+' %</td>'+
        '<td class="num mono">'+d.pendientes+'</td>'+
      '</tr>';
    }).join('')+
    '</tbody></table></div>';
  return '<div class="card card-pad">'+
    '<div class="card-head"><span class="card-title">'+datos.length+' contratista'+(datos.length===1?'':'s')+' con actividad registrada</span></div>'+
    tabla+
  '</div>';
}

function renderContratistaDetalle(id){
  const c = getContratista(id);
  if(!c) return renderContratistas();
  const muros = MUROS.filter(function(m){return m.contratistaId===id;});
  const total = muros.reduce(function(s,m){return s+m.areaTotal;},0);
  const val = muros.reduce(function(s,m){return s+m.areaValidada;},0);
  const pct = total>0? (val/total*100):0;
  const regs = REGISTROS.filter(function(r){return r.contratistaId===id;}).slice().sort(function(a,b){return b.fecha-a.fecha;});
  const pend = regs.filter(function(r){return r.estado==='Pendiente';}).length;

  return '<div style="display:flex;flex-direction:column;gap:16px;">'+
    '<button class="btn btn-ghost btn-sm" data-action="back-contratistas" style="align-self:flex-start;">'+icon('chevron')+' Volver a contratistas</button>'+
    '<div class="card card-pad">'+
      '<div class="card-eyebrow">'+c.actividad+' · '+c.contacto+'</div>'+
      '<h3 style="font-size:20px;margin-bottom:14px;">'+c.nombre+'</h3>'+
      '<div class="grid grid-4">'+
        kpiCard('Área contratada (mampostería)', fmtArea(total), 'm²')+
        kpiCard('Área validada', fmtArea(val), 'm²', fmtPct(pct)+'% de avance')+
        kpiCard('Registros pendientes', pend, '', pend>0?'Requieren revisión':'Al día', pend>0?'warn':'up')+
        kpiCard('Elementos asignados', muros.length, '')+
      '</div>'+
      '<div class="divider"></div>'+
      '<div class="card-eyebrow" style="margin-bottom:8px;">Resumen de avance reconocido</div>'+
      '<div style="display:flex;align-items:center;gap:14px;">'+
        '<div style="flex:1;">'+progressBar(pct,{cls:'validate'})+'</div>'+
        '<div class="mono" style="font-weight:700;">'+fmtPct(pct)+' %</div>'+
      '</div>'+
      '<div class="notice-banner" style="margin-top:14px;margin-bottom:0;">'+icon('info')+'<span>Esta información sirve de apoyo para el corte, pero no es un reconocimiento de pago automático — el área administrativa decide cómo usarla.</span></div>'+
    '</div>'+

    '<div class="card card-pad">'+
      '<div class="card-head"><span class="card-title">Elementos asignados</span></div>'+
      '<div class="table-wrap"><table><thead><tr><th>Código</th><th>Ubicación</th><th class="num">Área total</th><th class="num">Avance</th><th>Estado</th></tr></thead><tbody>'+
      muros.map(function(m){
        return '<tr class="row-link" data-action="open-muro" data-codigo="'+m.codigo+'">'+
          '<td class="cell-code">'+m.codigo+'</td><td class="cell-muted">'+m.ubicacion+'</td>'+
          '<td class="num mono">'+fmtArea(m.areaTotal)+' m²</td><td class="num mono">'+fmtPct(m.avanceValidado)+' %</td>'+
          '<td>'+badge(estadoMuro(m))+'</td></tr>';
      }).join('')+
      '</tbody></table></div>'+
    '</div>'+

    '<div class="card card-pad">'+
      '<div class="card-head"><span class="card-title">Registros relacionados</span></div>'+
      '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Muro</th><th class="num">Avance IA</th><th class="num">Cant. validada</th><th>Estado</th></tr></thead><tbody>'+
      regs.slice(0,15).map(function(r){
        return '<tr class="row-link" data-action="open-registro" data-id="'+r.id+'">'+
          '<td class="mono cell-muted">'+fmtFecha(r.fecha)+'</td><td class="cell-code">'+r.muroCodigo+'</td>'+
          '<td class="num mono">'+fmtPct(r.avanceDetectado)+' %</td>'+
          '<td class="num mono">'+(r.cantidadValidada!==null?fmtArea(r.cantidadValidada)+' m²':'—')+'</td>'+
          '<td>'+badge(r.estado)+'</td></tr>';
      }).join('')+
      '</tbody></table></div>'+
    '</div>'+
  '</div>';
}

/* ---------------------------------------------------------
   PANTALLA: REPORTES Y CONSOLIDACIÓN
   --------------------------------------------------------- */
function renderReportes(){
  const porContratista = validadoPorContratista();
  const porZona = avancePorZona();
  const evol = evolucionAcumuladaMensual();
  const dif = diferenciaIAvsValidacion();
  const tiempoProm = tiempoPromedioValidacion();
  const dist = distribucionEstados();
  const pend = pendientesCount();

  const indicadores = [
    {l:'Avance validado', v:fmtPct(avanceGlobalPct())+' %'},
    {l:'Metros cuadrados validados', v:fmtArea(totalAreaValidada())+' m²'},
    {l:'Registros pendientes', v:pend},
    {l:'Tiempo promedio de validación', v:(tiempoProm<1? Math.round(tiempoProm*60)+' seg' : fmtPct(tiempoProm)+' min')},
    {l:'Diferencia promedio IA vs. validación', v:fmtArea(dif.promedio)+' m² ('+fmtPct(dif.promedioPct)+'%)'},
    {l:'Validados sin ajuste', v:fmtPct(dist.validadoPct)+' %'},
    {l:'Registros ajustados', v:fmtPct(dist.ajustadoPct)+' %'},
    {l:'Registros rechazados', v:fmtPct(dist.rechazadoPct)+' %'},
  ];

  const difTabla = REGISTROS.filter(function(r){return r.estado==='Ajustado';}).slice(0,10);

  return '<div style="display:flex;flex-direction:column;gap:16px;">'+
    '<div class="card card-pad">'+
      '<div class="card-head"><span class="card-title">Indicadores del sistema</span></div>'+
      '<div class="grid grid-4">'+
        indicadores.map(function(i){ return '<div class="stat-mini"><span class="sm-label">'+i.l+'</span><span class="sm-value">'+i.v+'</span></div>'; }).join('')+
      '</div>'+
    '</div>'+

    '<div class="two-col">'+
      '<div class="card card-pad"><div class="card-head"><span class="card-title">m² validados por contratista</span></div>'+
        svgBarChart({labels:porContratista.map(function(c){return c.contratista.nombre.split(' ')[0];}), values:porContratista.map(function(c){return Math.round(c.val*10)/10;}), unit:' m²', colors:porContratista.map(function(){return 'var(--safety-500)';})})+
      '</div>'+
      '<div class="card card-pad"><div class="card-head"><span class="card-title">m² validados por zona</span></div>'+
        svgBarChart({labels:porZona.map(function(z){return z.zona;}), values:porZona.map(function(z){return Math.round(z.val*10)/10;}), unit:' m²', colors:porZona.map(function(){return 'var(--confidence-600)';})})+
      '</div>'+
    '</div>'+

    '<div class="card card-pad">'+
      '<div class="card-head"><span class="card-title">Evolución del avance (m² validados acumulados)</span></div>'+
      svgLineChart({labels:evol.labels, values:evol.values, unit:' m²'})+
    '</div>'+

    '<div class="two-col">'+
      '<div class="card card-pad">'+
        '<div class="card-head"><span class="card-title">Análisis pendientes</span></div>'+
        (pend===0? emptyState('Sin pendientes','No hay análisis a la espera de validación.','check') :
        '<div class="table-wrap"><table><thead><tr><th>Muro</th><th class="num">Avance IA</th><th>Estado</th></tr></thead><tbody>'+
          REGISTROS.filter(function(r){return r.estado==='Pendiente';}).map(function(r){
            return '<tr class="row-link" data-action="review-pendiente" data-id="'+r.id+'"><td class="cell-code">'+r.muroCodigo+'</td><td class="num mono">'+fmtPct(r.avanceDetectado)+' %</td><td>'+badge(r.estado)+'</td></tr>';
          }).join('')+
        '</tbody></table></div>')+
      '</div>'+
      '<div class="card card-pad">'+
        '<div class="card-head"><span class="card-title">Diferencia IA vs. validación humana</span></div>'+
        (difTabla.length===0 ? emptyState('Sin ajustes registrados','Todos los análisis se validaron tal como fueron estimados.','check') :
        '<div class="table-wrap"><table><thead><tr><th>Muro</th><th class="num">IA</th><th class="num">Validado</th><th class="num">Dif.</th></tr></thead><tbody>'+
          difTabla.map(function(r){
            const diff = Math.round((r.nuevaCantidadEstimada-r.cantidadValidada)*10)/10;
            return '<tr class="row-link" data-action="open-muro" data-codigo="'+r.muroCodigo+'"><td class="cell-code">'+r.muroCodigo+'</td>'+
              '<td class="num mono">'+fmtArea(r.nuevaCantidadEstimada)+'</td><td class="num mono">'+fmtArea(r.cantidadValidada)+'</td>'+
              '<td class="num mono" style="color:var(--safety-600)">'+(diff>=0?'+':'')+fmtArea(diff)+'</td></tr>';
          }).join('')+
        '</tbody></table></div>')+
      '</div>'+
    '</div>'+
  '</div>';
}

/* ---------------------------------------------------------
   MANEJO DE EVENTOS (delegación sobre #app)
   --------------------------------------------------------- */
function readImageFile(file){
  if(!file || file.type.indexOf('image/')!==0){ showToast('error','Selecciona un archivo de imagen válido.'); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    STATE.flow.imagen = ev.target.result;
    STATE.flow.imagenLabel = file.name;
    render();
  };
  reader.readAsDataURL(file);
}

function handleAppClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case 'login-submit':
      doLogin();
      break;
    case 'logout':
      logout();
      break;
    case 'nav':
      navigate(el.dataset.view);
      break;
    case 'toggle-sidebar':
      STATE.sidebarOpen = !STATE.sidebarOpen;
      render();
      break;
    case 'flow-goto':
      STATE.flow.step = el.dataset.step;
      STATE.flow.showReject = false;
      render();
      break;
    case 'flow-mode':
      STATE.flow.modo = el.dataset.mode;
      render();
      break;
    case 'flow-clear-image':
      STATE.flow.imagen = null; STATE.flow.imagenLabel='';
      render();
      break;
    case 'flow-demo-image':{
      const muro = getMuro(STATE.flow.muroCodigo);
      /* Imagen ilustrativa de referencia (para quien no tiene una fotografía
         a mano). No predetermina el resultado: el servicio de IA analizará
         esta imagen igual que analizaría una fotografía real. */
      const ilustrativoPct = clamp(muro.avanceValidado + 20, 0, 100);
      STATE.flow.imagen = demoWallImage(ilustrativoPct, hashStr(muro.codigo));
      STATE.flow.imagenLabel = 'Fotografía de referencia (demostración)';
      render();
      break;
    }
    case 'flow-analizar':
      if(!STATE.flow.imagen){ showToast('error','Carga una fotografía antes de analizar.'); return; }
      STATE.flow.analysisError = null;
      STATE.flow.step = 'analizando';
      render();
      break;
    case 'flow-toggle-reject':
      STATE.flow.showReject = !STATE.flow.showReject;
      render();
      break;
    case 'flow-validate':
      submitValidation(el.dataset.mode);
      break;
    case 'guardar-nuevo-elemento':
      guardarNuevoElemento();
      break;
    case 'open-registro':{
      const reg = REGISTROS.find(function(r){return r.id===el.dataset.id;});
      if(!reg) return;
      if(reg.estado==='Pendiente'){
        STATE.view='registrar';
        resetFlow({step:'resultado', muroCodigo:reg.muroCodigo, reviewingRegistroId:reg.id});
        render();
      } else {
        navigate('muro-detalle',{detalleMuroCodigo:reg.muroCodigo});
      }
      break;
    }
    case 'review-pendiente':{
      const reg = REGISTROS.find(function(r){return r.id===el.dataset.id;});
      if(!reg) return;
      STATE.view='registrar';
      resetFlow({step:'resultado', muroCodigo:reg.muroCodigo, reviewingRegistroId:reg.id});
      render();
      break;
    }
    case 'open-muro':
      navigate('muro-detalle',{detalleMuroCodigo:el.dataset.codigo});
      break;
    case 'open-contratista':
      navigate('contratistas',{contratistaDetalleId:el.dataset.id});
      break;
    case 'back-contratistas':
      STATE.contratistaDetalleId = null;
      render();
      break;
    case 'start-registro':{
      const m = getMuro(el.dataset.codigo);
      if(!m) return;
      STATE.view='registrar';
      resetFlow({zona:m.zona, piso:m.piso, muroCodigo:m.codigo, step:'evidencia'});
      render();
      break;
    }
    case 'hist-clear':
      STATE.historial = { zona:'', contratista:'', muro:'', estado:'', desde:'', hasta:'' };
      render();
      break;
    case 'elem-clear':
      STATE.elementos = { zona:'', contratista:'', estado:'' };
      render();
      break;
  }
}

function handleAppChange(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='flow-field'){
    const field = el.dataset.field;
    STATE.flow[field] = el.value;
    if(field==='zona'){ STATE.flow.piso=''; STATE.flow.muroCodigo=''; }
    if(field==='piso'){ STATE.flow.muroCodigo=''; }
    render();
  } else if(action==='flow-file'){
    const file = el.files && el.files[0];
    readImageFile(file);
  } else if(action==='hist-filter'){
    STATE.historial[el.dataset.field] = el.value;
    render();
  } else if(action==='elem-filter'){
    STATE.elementos[el.dataset.field] = el.value;
    render();
  }
}

function handleAppDrag(e){
  const zone = e.target.closest && e.target.closest('#uploadZone');
  if(!zone) return;
  if(e.type==='dragover'){ e.preventDefault(); zone.classList.add('drag'); }
  else if(e.type==='dragleave'){ zone.classList.remove('drag'); }
  else if(e.type==='drop'){
    e.preventDefault(); zone.classList.remove('drag');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    readImageFile(file);
  }
}

/* ---------------------------------------------------------
   ARRANQUE
   --------------------------------------------------------- */
function initApp(){
  const storedPw = sessionStorage.getItem('ladrix_pw');
  if(storedPw){ STATE.auth.loggedIn = true; STATE.auth.password = storedPw; }
  const app = document.getElementById('app');
  app.addEventListener('click', handleAppClick);
  app.addEventListener('change', handleAppChange);
  app.addEventListener('dragover', handleAppDrag);
  app.addEventListener('dragleave', handleAppDrag);
  app.addEventListener('drop', handleAppDrag);
  render();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}

</script>
